# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .<|reserved_token_163786|>

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `python-dateutil` to requirements.txt
# timezone =

# max length of characters to apply to the
# "version path" sanitation. Defaults to 100.
version_path_size = 100

# Set to 'true' to run the environment during
# the 'revision' command.
revision_environment = true

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions directory.
sourceless = false

# version path
# As above, allows for naked directory specifications
# to be applied to version_locations.  Defaults to version
# locations within the script location.
version_locations = %(here)s/alembic/versions

# the output encoding used when revision files
# are written from script_location
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# post_write_hooks defines scripts or Python objects that are run
# on newly generated revision scripts.  See the documentation for
# further detail and examples

# format using "black" - use the console_scripts entry point
# "black" is the entry point of a package
# hooks = black
# black_entry_point = black
# black_options = {}

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers =
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5s [%(asctime)s] %(name)s: %(message)s